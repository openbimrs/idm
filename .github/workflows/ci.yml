name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Run complete repository gate
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/openbim-idm-target
        run: ./scripts/gate.sh
