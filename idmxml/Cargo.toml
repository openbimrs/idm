[package]
name = "idmxml"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["openbimrs contributors"]
repository = "https://github.com/openbimrs/idm"
readme = "README.md"
description = "Pure Rust compatibility alias that re-exports openbim-idm"
keywords = ["bim", "idm", "xml"]
categories = ["parser-implementations", "data-structures"]
publish = false
include = ["src/lib.rs", "Cargo.toml", "README.md"]

[dependencies]
openbim-idm = { path = "../openbim-idm", version = "=0.1.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
